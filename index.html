<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F4F8">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Programme de musculation et suivi de progression, 100 % sur ton téléphone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mon suivi de musculation</title>
<style>

:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5B6878; --line:#D8DFE8; --prop:#B4BFCD; --on-c:#FFFFFF;
  --push:#D6334C; --pull:#2457E6; --legs:#13875C; --upper:#7142D6; --lower:#B87500; --abs:#0A7F96; --rest:#5E6B7E; --good:#13875C; --bad:#C23B2E;
  --nav-h:58px; --done-t:#7CF0B8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1320; --surface:#152033; --ink:#EAF0F8; --muted:#9AA9BC; --line:#25324A; --prop:#3B4C69; --on-c:#0C1320;
    --push:#FF6B80; --pull:#7FA2FF; --legs:#3DD6A0; --upper:#B197FF; --lower:#F0B03A; --abs:#4CCBE3; --rest:#A8B3C6; --good:#3DD6A0; --bad:#FF8A7D; --done-t:#0E7A52;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1320; --surface:#152033; --ink:#EAF0F8; --muted:#9AA9BC; --line:#25324A; --prop:#3B4C69; --on-c:#0C1320;
  --push:#FF6B80; --pull:#7FA2FF; --legs:#3DD6A0; --upper:#B197FF; --lower:#F0B03A; --abs:#4CCBE3; --rest:#A8B3C6; --good:#3DD6A0; --bad:#FF8A7D; --done-t:#0E7A52;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 10px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.top h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="saving"] i{background:var(--lower)}
.sync[data-s="error"] i{background:var(--bad)}
.sync[data-s="local"] i{background:var(--lower)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.tabs::-webkit-scrollbar{display:none}
.tabs[hidden]{display:none}
.tab{
  flex:0 0 auto;min-width:62px;border:1.5px solid var(--line);background:var(--surface);
  border-radius:12px;padding:6px 11px;text-align:center;cursor:pointer;line-height:1.2;
}
.tab b{display:block;font-size:.95rem}
.tab small{display:block;font-size:.72rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--on-c)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.tab[aria-selected="true"] .dot{background:var(--on-c)}
.tab:focus-visible,.setbtn:focus-visible,.yt:focus-visible,.ghost:focus-visible,.prior:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.nav button:focus-visible,.seg button:focus-visible,.primary:focus-visible{outline:3px solid var(--c,var(--pull));outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:16px 14px calc(var(--nav-h) + 130px)}
.dayhead{margin:2px 0 14px}
.dayhead .when{color:var(--c);font-weight:700;font-size:.95rem}
.dayhead h2{margin:0;font-size:2.1rem;line-height:1.05;letter-spacing:-.03em}
.dayhead p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.pgnote{margin:-4px 2px 12px;color:var(--muted);font-size:.85rem}
.datepick{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:.9rem}
input[type="date"]{
  height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:.95rem;padding:0 8px;
}
details.warm{
  background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;
  padding:10px 14px;margin-bottom:14px;
}
details.warm summary{cursor:pointer;font-weight:700}
details.warm ol{margin:8px 0 2px;padding-left:20px;color:var(--muted)}
details.warm li{margin:3px 0}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
/* .fig : défini plus bas (mannequin + carte des muscles) */
.order{
  position:absolute;left:10px;top:10px;min-width:26px;height:26px;border-radius:13px;padding:0 8px;
  background:var(--c);color:var(--on-c);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;
}
.body{padding:12px 14px 14px}
.body h3{margin:0;font-size:1.12rem;line-height:1.25;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chip{
  border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 10%,var(--surface));
  border-radius:999px;padding:3px 10px;font-size:.88rem;font-weight:600;
}
.chip.soft{border-color:var(--line);background:transparent;color:var(--muted);font-weight:500}
.cue{margin:10px 0 0;color:var(--muted);font-size:.95rem}
.prior{
  display:block;width:100%;text-align:left;cursor:pointer;
  margin-top:12px;padding:10px 12px;border-radius:12px;border:1.5px dashed color-mix(in srgb,var(--c) 55%,var(--line));
  background:color-mix(in srgb,var(--c) 6%,var(--surface));
}
.prior b{font-size:1.02rem}
.prior small{display:block;color:var(--muted);font-size:.8rem}
.prior em{font-style:normal;color:var(--c);font-weight:700;font-size:.88rem;white-space:nowrap}
.prior.none{cursor:default;border-style:solid;border-color:var(--line);background:transparent;color:var(--muted)}
.goal{margin:8px 0 0;font-size:.92rem}
.goal b{color:var(--c)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.setbtn{
  width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);
  font-weight:700;font-size:1rem;cursor:pointer;
}
.setbtn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-c)}
.shead{display:flex;gap:10px;margin:14px 0 4px;color:var(--muted);font-size:.78rem}
.shead span:nth-child(1){width:48px;text-align:center}
.shead span:nth-child(2){width:84px;text-align:right;padding-right:10px}
.shead span:nth-child(3){flex:1}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px}
.sr{
  width:84px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);
  font:inherit;font-size:1.1rem;font-weight:700;padding:0 10px;text-align:right;
}
.sprev{flex:1;min-width:0;color:var(--muted);font-size:.85rem}
.sdel{min-width:34px;text-align:right;font-weight:700;font-size:.95rem}
.sdel.up{color:var(--good)} .sdel.down{color:var(--bad)} .sdel.eq{color:var(--muted)}
.addset{margin-top:10px}
.legacy{margin:8px 0 0;color:var(--muted);font-size:.85rem}
.notes{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ntog{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;border:0;background:transparent;
  font-weight:700;font-size:.95rem;cursor:pointer;
}
.ntog svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ntog[aria-expanded="true"] svg{transform:rotate(90deg)}
.ncount{color:var(--muted);font-weight:600}
.nplus{
  width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--c);font-size:1.5rem;line-height:1;font-weight:700;cursor:pointer;
}
.nbody{padding:2px 0 4px}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{display:flex;align-items:center;gap:8px;padding:2px 0 2px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.nlist li span{flex:1;overflow-wrap:anywhere;padding:6px 0}
.ndel{border:0;background:transparent;color:var(--muted);min-width:44px;min-height:44px;font-size:1.25rem;cursor:pointer}
.nadd{display:flex;gap:8px;margin-top:8px}
.nadd input{
  flex:1;min-width:0;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);
  font:inherit;font-size:1rem;padding:0 10px;
}
.nprev{margin:10px 0 0;color:var(--muted);font-size:.85rem}
.nprev ul{margin:4px 0 0;padding-left:18px}
.ntog:focus-visible,.nplus:focus-visible,.ndel:focus-visible,.addset:focus-visible,.sr:focus-visible{outline:3px solid var(--c,var(--pull));outline-offset:2px}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.fields{display:flex;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.fld input,.bform input{
  width:92px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);
  font:inherit;font-size:1.1rem;font-weight:700;padding:0 10px;text-align:right;
}
.delta{min-height:1.3em;margin:8px 0 0;font-size:.9rem;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.eq{color:var(--muted)}
.yt{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;color:var(--c);font-weight:700;text-decoration:none;font-size:.92rem}
.yt:hover{text-decoration:underline}
.tools{display:flex;justify-content:center;margin-top:6px}
.ghost,.primary{
  min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;
}
.ghost{border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.primary{border:0;background:var(--c);color:var(--on-c);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p,.card li{color:var(--muted);margin:4px 0}
.card ul{margin:6px 0 0;padding-left:20px}
.card strong{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.stat b{display:block;font-size:1.35rem;letter-spacing:-.02em;line-height:1.15}
.stat small{color:var(--muted);font-size:.78rem;line-height:1.2;display:block;margin-top:2px}
.seg{display:flex;gap:6px;margin:0 0 12px;background:color-mix(in srgb,var(--c) 8%,var(--bg));padding:4px;border-radius:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--c) inset}
select{
  width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:1rem;padding:0 10px;margin-bottom:12px;
}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 6px;margin-bottom:12px}
.chart h3{margin:0 0 2px 8px;font-size:1rem}
.chart .sub{margin:0 0 4px 8px;color:var(--muted);font-size:.85rem}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font-size:10px}
.chart .vl{fill:var(--ink);font-size:10px;font-weight:700}
.chart .ln2{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--surface);stroke:var(--c);stroke-width:2}
.chart .bar{fill:var(--c)}
.chart .area{fill:var(--c);opacity:.1}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px 16px;color:var(--muted);text-align:center;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:.8rem}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.xbtn{border:0;background:transparent;color:var(--muted);min-width:40px;min-height:40px;font-size:1.1rem;cursor:pointer}
.bform{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bform label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:0 6px env(safe-area-inset-bottom,0px);
}
.nav button{
  flex:1;height:var(--nav-h);border:0;background:transparent;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:600;
}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{stroke:var(--pull)}
#timer{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:10;background:var(--ink);color:var(--bg);
  padding:10px 14px;display:flex;align-items:center;gap:12px;
}
#timer[hidden]{display:none}
#timer .info{flex:1;min-width:0}
#timer .lbl{font-size:.82rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer .time{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
#timer.done .time{color:var(--done-t)}
#timer button{
  min-height:44px;min-width:56px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--bg) 40%,transparent);
  background:transparent;color:var(--bg);font-weight:600;cursor:pointer;
}
.fg{display:block;width:100%;height:100%}
.fg .gl{stroke:var(--prop);stroke-width:1;opacity:.6}
.fg .pp{fill:var(--prop)}
.fg .pl{fill:none;stroke:var(--prop);stroke-width:5;stroke-linecap:round}
.fg .pl2{fill:none;stroke:var(--prop);stroke-width:2.5;stroke-linecap:round}
.fg .rail{fill:none;stroke:var(--prop);stroke-width:2;stroke-linecap:round;opacity:.8}
.fg .cb{stroke:var(--prop);stroke-width:.9;stroke-dasharray:2.2 2;fill:none}
.fg .pul{fill:var(--prop)}
.fg .plat{stroke:var(--prop);stroke-width:3.2;stroke-linecap:round}
.fg .og path,.fg .fg2 path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fg .og path{stroke:var(--c)}
.fg .og circle{fill:var(--c)}
.fg .fg2 path{stroke:var(--fc)}
.fg .fg2 circle{fill:var(--fc)}
.fg .rig{--fc:color-mix(in srgb,var(--c) 11%,var(--surface))}
.fg .ly.near{--fc:color-mix(in srgb,var(--c) 24%,var(--surface))}
.fg .ly.far{--fc:color-mix(in srgb,var(--c) 9%,var(--surface))}
.fg .ly.far .og path{stroke:color-mix(in srgb,var(--c) 55%,var(--surface))}
.fg .ly.far.sym{--fc:color-mix(in srgb,var(--c) 24%,var(--surface))}
.fg .ly.far.sym .og path{stroke:var(--c)}
.fg .ghost{opacity:.2}
.fg .imp .plate{fill:var(--ink);opacity:.88}
.fg .imp .hub{fill:var(--surface)}

.mmv{display:block;height:100%;width:auto;flex:1 1 0;min-width:0}
.mmv .mb *{fill:color-mix(in srgb,var(--ink) 8%,var(--surface));stroke:color-mix(in srgb,var(--ink) 8%,var(--surface));stroke-linecap:round;stroke-linejoin:round}
.mmv .mr path,.mmv .mr circle,.mmv .mr rect{fill:var(--k);stroke:var(--surface);stroke-width:.7}
.mmv .mr line{stroke:var(--k);stroke-linecap:round;fill:none}
.mmv .mr .s0{--k:color-mix(in srgb,var(--ink) 14%,var(--surface))}
.mmv .mr .s1{--k:var(--c)}
.mmv .mr .s2{--k:color-mix(in srgb,var(--c) 40%,var(--surface))}


/* ---------- en-tête, statut de sauvegarde ---------- */
.sync{border:0;background:transparent;cursor:pointer;padding:6px 2px 6px 8px;min-height:36px;color:var(--muted)}
.sync[data-s="warn"] i{background:var(--lower)}
.sync[data-s="warn"]{color:var(--ink)}
.sync:focus-visible{outline:3px solid var(--pull);outline-offset:2px}
.seg button{font-size:.88rem;padding:0 4px}
.tab{position:relative}
.tab .ck{display:none;position:absolute;top:2px;right:2px;width:11px;height:11px;fill:none;stroke:var(--good);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.done .ck{display:block}
.tab[aria-selected="true"] .ck{stroke:var(--on-c)}
/* ---------- bannières ---------- */
.bnr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--pull) 12%,var(--surface));border-bottom:1px solid var(--line);font-size:.9rem}
.bnr.warn{background:color-mix(in srgb,var(--lower) 16%,var(--surface))}
.bnr span{flex:1}
.bnr button{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--pull);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
.bnr button.x{border:0;min-width:40px;padding:0;color:var(--muted);font-size:1.25rem;font-weight:400}
/* ---------- carte d'exercice : mannequin + muscles ---------- */
.fig{position:relative;display:flex;height:168px;background:color-mix(in srgb,var(--c) 7%,var(--surface));border-bottom:1px solid var(--line)}
.mv{flex:1 1 58%;min-width:0}
.mv svg.fg{width:100%;height:100%}
.mm{flex:0 0 38%;display:flex;gap:2px;justify-content:center;padding:8px 6px;border-left:1px dashed var(--line)}
.prb{position:absolute;left:46px;top:10px;height:26px;padding:0 10px;border-radius:13px;background:#F5B73B;color:#2A1B00;font-weight:800;font-size:.8rem;display:flex;align-items:center;letter-spacing:.02em}
.prb[hidden]{display:none}
.mus{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
.mc{font-size:.76rem;line-height:1.2;padding:3px 9px;border-radius:999px}
.mc.p{background:var(--c);color:var(--on-c);font-weight:700}
.mc.s{border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pbx{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.pbx b{flex:1;min-width:0}
.spk{flex:0 0 auto;display:flex;align-items:center}
.spk svg path{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spk svg circle{fill:var(--c)}
.rec{display:block;margin-top:3px;color:var(--muted);font-size:.85rem}
.fillbar{margin:0 0 12px;display:flex;justify-content:center}
.tools{gap:10px;flex-wrap:wrap}
.primary:disabled{opacity:.4;cursor:default}
/* ---------- bilan de séance ---------- */
body.modal{overflow:hidden}
#recap{position:fixed;inset:0;z-index:30;background:rgba(8,14,26,.55);display:flex;align-items:flex-end;justify-content:center}
#recap[hidden]{display:none}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.shh .when{color:var(--c);font-weight:700;font-size:.9rem}
.shh .when::first-letter,.jd b::first-letter{text-transform:uppercase}
.shh h2{margin:0;font-size:1.5rem;line-height:1.1;letter-spacing:-.02em}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 4px}
.rcnote{margin:4px 2px 10px;color:var(--muted);font-size:.82rem}
.rcbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 0}
.rcbox h3{margin:0 0 6px;font-size:1rem}
.rcbox p{margin:0;color:var(--muted)}
.rcbox ul{list-style:none;margin:0;padding:0}
.rcbox.pr{border-color:#F5B73B;background:color-mix(in srgb,#F5B73B 12%,var(--surface))}
.rcbox.pr li{display:flex;flex-direction:column;padding:4px 0}
.rcbox.pr li span{color:var(--muted);font-size:.9rem}
.cmpsum{font-size:.85rem;margin-left:6px;font-weight:700}
.cmpsum .up,.rc.up{color:var(--good)} .cmpsum .down,.rc.down{color:var(--bad)} .cmpsum .eq,.rc.eq{color:var(--muted)} .rc.new{color:var(--c)}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rn{min-width:0}
.rn b{display:block;font-size:.95rem;line-height:1.25}
.rn span{display:block;font-size:.92rem}
.rn small{display:block;color:var(--muted);font-size:.8rem}
.rc{flex:0 0 auto;min-width:66px;text-align:right;font-weight:700}
.rc i{font-style:normal}
.rc small{display:block;font-size:.7rem;font-weight:600}
.wide{width:100%;margin-top:14px}
.mini{display:inline-block;font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:999px;background:#F5B73B;color:#2A1B00;vertical-align:1px;letter-spacing:.02em}
/* ---------- journal ---------- */
.jwk{margin:16px 2px 6px;font-size:.85rem;color:var(--muted);font-weight:600}
.jrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.jd{flex:1;min-width:0}
.jd b{display:block}
.jd small{color:var(--muted)}
.jm{font-size:.78rem;color:var(--muted);text-align:right;max-width:120px}
.jrow i{font-style:normal;color:var(--muted);font-size:1.4rem;line-height:1}
.jrow:focus-visible{outline:3px solid var(--c);outline-offset:2px}
/* ---------- graphiques : records, muscles ---------- */
.chart .pt.prp{fill:var(--c)}
.prkey{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c)}
.mchart .seg{margin:6px 8px 10px}
.mchart .sub{margin-right:8px}
.mbars{display:flex;flex-direction:column;gap:7px;padding:0 10px 8px}
.mb{display:flex;align-items:center;gap:8px;font-size:.85rem}
.ml{flex:0 0 112px}
.mt{position:relative;flex:1;height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,var(--surface));overflow:hidden}
.zone{position:absolute;left:41.67%;width:41.67%;top:0;bottom:0;background:color-mix(in srgb,var(--good) 20%,transparent)}
.mf{position:absolute;left:0;top:2px;bottom:2px;border-radius:5px}
.mf.ok{background:var(--good)} .mf.lo{background:var(--lower)} .mf.hi{background:var(--bad)}
.mv2{flex:0 0 32px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
/* ---------- onglet Plus ---------- */
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.danger{color:var(--bad)!important;border-color:color-mix(in srgb,var(--bad) 50%,var(--line))!important}
.msg{margin:10px 0 0;font-size:.9rem}
.msg.bad{color:var(--bad)}
.impbox{margin-top:12px;padding:10px 12px;border:1.5px dashed var(--pull);border-radius:12px;background:color-mix(in srgb,var(--pull) 6%,var(--surface))}
.impbox[hidden]{display:none}
.impbox p{margin:0 0 4px}
.hint{font-size:.82rem}
.paste{margin-top:12px}
.paste summary{cursor:pointer;color:var(--muted);min-height:32px}
textarea{display:block;width:100%;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;padding:8px;margin:8px 0}
.tgl{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--ink)}
.tgl input{width:22px;height:22px;flex:0 0 auto}
.fld.sel{margin-top:10px}
.fld.sel select{margin-bottom:0}
.about{text-align:center;color:var(--muted);font-size:.8rem;margin:18px 0 0}
#toast{position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + 76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:.92rem;text-align:center;max-width:520px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

/* jour de repos */
.restcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.restcard h3{margin:0 0 6px;font-size:1.02rem}
.restcard p{margin:0 0 6px;color:var(--muted);font-size:.93rem}
.restcard ul{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:.93rem}
.restcard li{margin-bottom:4px}
.restcard li b{color:var(--ink)}
.restcard .ghost{margin-top:8px}
.nextup{display:flex;align-items:center;gap:12px}
.nextup i{flex:0 0 auto;width:10px;height:36px;border-radius:5px;background:var(--nc)}
.nextup div{min-width:0}
.nextup b{display:block}
.nextup span{color:var(--muted);font-size:.9rem}

    var dx=T[0]-O[0],dy=T[1]-O[1],d=Math.sqrt(dx*dx+dy*dy)||0.001,end=T;
    var dm=a+b-0.03;
    if(d>dm){end=[O[0]+dx/d*dm,O[1]+dy/d*dm];d=dm}
    var dn=Math.abs(a-b)+0.05;

    var c=(a*a+d*d-b*b)/(2*a*d);c=Math.max(-1,Math.min(1,c));
    var ang=base+bend*Math.acos(c);

  }

    if(arm.hand){var r=ik(S,arm.hand,LEN.ua,LEN.fa,arm.b||1);return {E:r.E,W:r.P}}

    else{var l=j.leg;j.leg2={K:add(l.K,FAR),A:add(l.A,FAR),toe:add(l.toe,FAR),heel:add(l.heel,FAR)}}

    catch(e){storageOK=false}
    updateStatus();
  }
  function queueWrite(){clearTimeout(wt);wt=setTimeout(persist,250)}

  window.addEventListener('pagehide',flushNow);

  /* ================= Données de séance ================= */
  var TODAY=ymd(new Date());

  function sid(day,date){return 's_'+date+'_'+day}
  function getEntry(exId){
    var d=S.docs[sid(EXMAP[exId].day,curDate)];
    return (d&&d.ex&&d.ex[exId])||{};
  }
  function setEntry(exId,patch){
    var day=EXMAP[exId].day,id=sid(day,curDate);
    var d=S.docs[id];
    if(!d)d=S.docs[id]={kind:'session',date:curDate,day:day,ex:{}};
    if(!d.ex)d.ex={};
    if(!d.t0&&curDate===ymd(new Date()))d.t0=Date.now();
    var e=d.ex[exId]||(d.ex[exId]={});
    Object.keys(patch).forEach(function(k){
      if(patch[k]===null||patch[k]===undefined)delete e[k];else e[k]=patch[k];
    });
    /* on garde les tableaux jusqu'à la dernière série qui contient une donnée */
    var last=-1,rl=e.reps?e.reps.length:0,sl=e.s?e.s.length:0;
    for(var i=Math.max(rl,sl)-1;i>=0;i--){
      if((e.reps&&e.reps[i]>0)||(e.s&&e.s[i]===1)){last=i;break}
    }
    if(e.reps){if(last<0)delete e.reps;else if(e.reps.length>last+1)e.reps.length=last+1}
    if(e.s){if(last<0)delete e.s;else if(e.s.length>last+1)e.s.length=last+1}
    if(!(e.w>0)&&last<0&&!(e.r>0)&&!(e.n&&e.n.length))delete d.ex[exId];
    if(!Object.keys(d.ex).length)delete S.docs[id];
    queueWrite();markDone();updateStatus();
  }
  function canon(id){var e=EXMAP[id];return e&&e.alias?e.alias:id}
  function stats(date,e,bw){
    var rp=repsOf(e),pos=rp.reps.filter(function(x){return x>0});
    return {date:date,w:bw?0:e.w,bw:!!bw,tot:pos.reduce(function(a,b){return a+b},0),reps:rp.reps,lg:rp.lg,sets:setsDone(e),
      min:pos.length?Math.min.apply(null,pos):0,max:pos.length?Math.max.apply(null,pos):0};
  }
  function history(exId){
    var out=[],c=canon(exId);
    Object.keys(S.docs).forEach(function(k){
      var d=S.docs[k];
      if(d.kind!=='session'||!d.ex)return;
      Object.keys(d.ex).forEach(function(xid){
        if(canon(xid)!==c)return;
        var e=d.ex[xid],x=EXMAP[xid];
        if(!logged(x,e))return;
        out.push(stats(d.date,e,!!(x&&x.bw)));
      });
    });
    out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
    return out;
  }
  function before(hist,date){return hist.filter(function(x){return x.date<date})}
  function lastOf(a){return a.length?a[a.length-1]:null}
  function bestOf(a){
    var b=null;
    a.forEach(function(h){if(!b||e1rmOf(h)>e1rmOf(b))b=h});
    return b;
  }
  /* un record = meilleure force estimée, ou charge la plus lourde, battue par rapport à toutes les séances précédentes */
  function prInfo(h,hist){
    var prev=before(hist,h.date);
    if(!prev.length)return null;
    if(h.bw){var bt=0;prev.forEach(function(x){if(x.tot>bt)bt=x.tot});return h.tot>bt?{charge:false,force:true}:null}
    if(!(h.w>0))return null;
    var bw=0,be=0;
    prev.forEach(function(x){if(x.w>bw)bw=x.w;var v=e1rmOf(x);if(v>be)be=v});
    var o={charge:h.w>bw+0.001,force:e1rmOf(h)>be*1.005};
    return (o.charge||o.force)?o:null;
  }
  function priorNotes(exId,date){
    var c=canon(exId),best=null;
    Object.keys(S.docs).forEach(function(k){
      var d=S.docs[k];
      if(d.kind!=='session'||!d.ex||d.date>=date)return;
      Object.keys(d.ex).forEach(function(xid){
        var e=d.ex[xid];
        if(canon(xid)!==c||!e.n||!e.n.length)return;
        if(!best||d.date>best.date)best={date:d.date,n:e.n};
      });
    });
    return best;
  }
  function sessionTonnage(d){
    var t=0;
    Object.keys(d.ex||{}).forEach(function(k){
      var e=d.ex[k];
      if(!(e.w>0))return;
      repsOf(e).reps.forEach(function(r){if(r>0)t+=e.w*r});
    });
    return t;
  }
  function sessionDone(d){
    return Object.keys(d.ex||{}).some(function(k){

  function sessions(){

  /* ================= Graphiques ================= */
  function lineChart(points,fmtY,fmtX){
    if(!points.length)return '';
    var W=320,H=190,pl_=40,pr=14,pt=16,pb=26;
    var ys=points.map(function(p){return p.y});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    if(min===max){min-=1;max+=1}
    var padv=(max-min)*0.18;min-=padv;max+=padv;
    var t0=points[0].t,t1=points[points.length-1].t;
    if(t0===t1){t0-=86400000*3;t1+=86400000*3}
    function X(t){return pl_+(t-t0)/(t1-t0)*(W-pl_-pr)}
    function Y(v){return pt+(1-(v-min)/(max-min))*(H-pt-pb)}
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graphique d\'évolution">';
    for(var i=0;i<4;i++){
      var v=min+(max-min)*i/3,y=Y(v);
      s+='<line class="ax" x1="'+pl_+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'"/>'
        +'<text class="tx" x="'+(pl_-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fmtY(v)+'</text>';
    }
    var d='',area='';
    points.forEach(function(p,i){
      var x=X(p.t).toFixed(1),y=Y(p.y).toFixed(1);
      d+=(i?'L':'M')+x+' '+y+' ';
    });
    if(points.length>1){
      area=d+'L'+X(points[points.length-1].t).toFixed(1)+' '+(H-pb)+' L'+X(points[0].t).toFixed(1)+' '+(H-pb)+' Z';
      s+='<path class="area" d="'+area+'"/><path class="ln2" d="'+d+'"/>';
    }
    points.forEach(function(p){
      s+='<circle class="pt'+(p.pr?' prp':'')+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(p.pr?4.2:3.4)+'"/>';
    });
    var last=points[points.length-1];
    s+='<text class="vl" x="'+Math.min(X(last.t),W-pr-6).toFixed(1)+'" y="'+(Y(last.y)-9).toFixed(1)+'" text-anchor="middle">'+fmtY(last.y)+'</text>';
    s+='<text class="tx" x="'+pl_+'" y="'+(H-8)+'" text-anchor="start">'+fmtX(points[0])+'</text>';
    if(points.length>1)s+='<text class="tx" x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end">'+fmtX(last)+'</text>';
    return s+'</svg>';
  }
  function barChart(items,fmtV){
    var W=320,H=170,pl_=10,pr=10,pt=18,pb=26;
    var max=Math.max.apply(null,items.map(function(i){return i.v}).concat([1]));
    var n=items.length,gap=6,bw=(W-pl_-pr-gap*(n-1))/n;
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graphique en barres">';
    s+='<line class="ax" x1="'+pl_+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'"/>';
    items.forEach(function(it,i){
      var h=(H-pt-pb)*it.v/max,x=pl_+i*(bw+gap),y=H-pb-h;
      if(it.v>0)s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>';
      if(it.v>0&&(n<=8||i===n-1||i%3===0))s+='<text class="vl" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+fmtV(it.v)+'</text>';
      if(n<=8||((n-1-i)%2===0))s+='<text class="tx" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.l)+'</text>';
    });

  }
  function spark(vals){
    if(vals.length<2)return '';
    var W=60,H=24,p=3,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
    if(max===min){max+=1;min-=1}
    var pts=vals.map(function(v,i){return [p+i*(W-2*p)/(vals.length-1),p+(1-(v-min)/(max-min))*(H-2*p)]});
    var d=pts.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ');

  function goalHtml(ex,pr,rec){

  function deltaInfo(ex,e,pr){
    var bw=!!ex.bw;
    if(!pr||!logged(ex,e))return {t:'',c:''};
    var dw=bw?0:Math.round((e.w-pr.w)*100)/100;
    if(dw>0)return {t:'+'+num(dw)+' kg depuis le '+fmtDate(pr.date),c:'up'};
    if(dw<0)return {t:num(dw)+' kg depuis le '+fmtDate(pr.date),c:'down'};
    var cur=repsOf(e).reps,m=Math.min(cur.length,pr.reps.length),diff=0,cmp=0,i;
    for(i=0;i<m;i++){if(cur[i]>0&&pr.reps[i]>0){diff+=cur[i]-pr.reps[i];cmp++}}
    var parts=[],c='eq';
    if(!pr.lg&&cmp>0&&diff!==0){
      parts.push((diff>0?'+':'')+diff+(bw&&isSec(ex)?' s':' rep'+(Math.abs(diff)>1?'s':''))+(bw?'':' à charge égale'));
      c=diff>0?'up':'down';
    }
    var ds=setsDone(e)-pr.sets;
    if(pr.sets>0&&ds>0){parts.push('+'+ds+' série'+(ds>1?'s':''));if(c==='eq')c='up'}
    if(!parts.length)return {t:(cmp>0&&!pr.lg)||bw?'Identique à la dernière fois':'Même charge que la dernière fois',c:'eq'};
    return {t:parts.join(' · '),c:c};
  }
  function setDelta(val,prev,lg){

  }

  /* ================= Bilan de séance ================= */
  function cmpStats(c,p){
    if(!p)return 'new';
    var a=e1rmOf(c),b=e1rmOf(p);
    if(a>b*1.015)return 'up';
    if(a<b*0.985)return 'down';
    var ta=tonOf(c),tb=tonOf(p);
    if(ta>tb*1.05)return 'up';
    if(ta<tb*0.95)return 'down';
    return 'eq';
  }
  function recapData(d){
    var prog=progOfDoc(d),dayObj=PROGS[prog].days.filter(function(x){return x.key===d.day})[0]||PROGS.A.days[0];
    var order={},ids=[];
    dayObj.ex.forEach(function(ex,i){order[ex.id]=i});
    Object.keys(d.ex||{}).forEach(function(k){ids.push(k)});
    ids.sort(function(a,b){return (order[a]===undefined?99:order[a])-(order[b]===undefined?99:order[b])});
    var rows=[],prs=[],sets=0,up=0,eq=0,down=0;
    ids.forEach(function(id){
      var e=d.ex[id],ex=EXMAP[id];
      if(!ex||!(e.w>0||setsDone(e)>0))return;
      sets+=setsDone(e);
      if(!logged(ex,e)){rows.push({ex:ex,cur:null,cmp:'none'});return}
      var h=stats(d.date,e,!!ex.bw),hist=history(id),prv=lastOf(before(hist,d.date));
      var pi=prInfo(h,hist),c=pi?'up':cmpStats(h,prv);
      if(c==='up')up++;else if(c==='down')down++;else if(c==='eq')eq++;
      if(pi)prs.push({ex:ex,pi:pi,h:h});
      rows.push({ex:ex,cur:h,prev:prv,cmp:c,pi:pi});
    });
    var done={};rows.forEach(function(r){done[r.ex.id]=1});
    var missing=dayObj.ex.filter(function(ex){return !done[ex.id]&&!done[canon(ex.id)]});
    var prevS=sessions().filter(function(x){return x.day===d.day&&x.date<d.date}).sort(function(a,b){return a.date<b.date?-1:1});
    var ps=lastOf(prevS),ton=sessionTonnage(d),pton=ps?sessionTonnage(ps):0;
    var dur=(d.t0&&d.t1&&d.t1>d.t0)?Math.round((d.t1-d.t0)/60000):0;
    if(dur>240)dur=0;
    return {d:d,day:dayObj,rows:rows,prs:prs,sets:sets,up:up,eq:eq,down:down,missing:missing,ton:ton,pton:pton,pdate:ps?ps.date:null,dur:dur,total:dayObj.ex.length};
  }
  var CMP={up:['▲','en progrès'],down:['▼','en recul'],eq:['=','stable'],new:['★','première fois'],none:['','']};

  function weeksBack(n){

  function download(blob,filename){
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{URL.revokeObjectURL(a.href)}catch(e){}a.remove()},4000);
    return 'downloaded';
  }
  function saveFile(filename,text,mime,allowShare){
    var blob=new Blob([text],{type:mime});
    if(allowShare){
      try{
        var f=new File([blob],filename,{type:mime});
        if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){
          return navigator.share({files:[f],title:filename}).then(function(){return 'shared'},function(e){
            if(e&&e.name==='AbortError')return 'cancelled';
            return download(blob,filename);
          });
        }
      }catch(e){}
    }
    return Promise.resolve(download(blob,filename));
  }

  function copyText(txt){
    function fallback(){
      var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();var ok=false;

      ta.remove();return ok;
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      return navigator.clipboard.writeText(txt).then(function(){return true},function(){return fallback()});
    }
    return Promise.resolve(fallback());
  }

    var txt='﻿'+rows.map(function(r){return r.map(csvEscape).join(';')}).join('\n')+'\n\n'+rows2.map(function(r){return r.map(csvEscape).join(';')}).join('\n');

  var DATE_RE=/^\d{4}-\d{2}-\d{2}$/,DAYKEYS=PROGS.A.days.filter(function(x){return !x.rest}).map(function(x){return x.key});
  function cleanEntry(e){
    if(!e||typeof e!=='object')return null;
    var o={};
    if(e.w>0&&isFinite(e.w))o.w=+e.w;
    if(Array.isArray(e.reps))o.reps=e.reps.map(function(x){return x>0&&isFinite(x)?Math.min(999,Math.round(x)):0});
    if(Array.isArray(e.s))o.s=e.s.map(function(x){return x===1?1:0});
    if(e.r>0&&isFinite(e.r))o.r=Math.round(e.r);
    if(Array.isArray(e.n)){var n=e.n.filter(function(t){return typeof t==='string'&&t}).map(function(t){return t.slice(0,140)});if(n.length)o.n=n}
    return Object.keys(o).length?o:null;
  }
  /* lit un fichier d'export (ou l'ancien état) et le nettoie : renvoie {docs, nSes, nBody, skipped} ou {err} */
  function parseImport(text){
    var o;
    try{o=JSON.parse(text)}catch(e){return {err:'Ce n\'est pas un fichier JSON valide.'}}
    var src=(o&&o.docs&&typeof o.docs==='object')?o.docs:o;
    if(!src||typeof src!=='object'||Array.isArray(src))return {err:'Format non reconnu.'};
    var docs={},nSes=0,nBody=0,skipped=0;
    Object.keys(src).forEach(function(k){
      var d=src[k];
      if(!d||typeof d!=='object'){skipped++;return}
      if(d.kind==='session'&&DATE_RE.test(d.date||'')&&DAYKEYS.indexOf(d.day)>=0&&d.ex&&typeof d.ex==='object'){
        var ex={},any=false;
        Object.keys(d.ex).forEach(function(xid){if(!EXMAP[xid])return;var c=cleanEntry(d.ex[xid]);if(c){ex[xid]=c;any=true}});
        if(!any){skipped++;return}
        var nd={kind:'session',date:d.date,day:d.day,ex:ex};
        if(d.t0>0)nd.t0=+d.t0;if(d.t1>0)nd.t1=+d.t1;
        docs[sid(d.day,d.date)]=nd;nSes++;
      }else if(d.kind==='body'&&DATE_RE.test(d.date||'')&&(d.kg>0||d.waist>0)){
        var nb={kind:'body',date:d.date};if(d.kg>0)nb.kg=+d.kg;if(d.waist>0)nb.waist=+d.waist;
        docs['b_'+d.date]=nb;nBody++;
      }else if(d.kind==='prefs'){
        if(PROGS[d.prog])docs.prefs={kind:'prefs',prog:d.prog};
      }else skipped++;
    });
    if(!nSes&&!nBody)return {err:'Aucune séance ni mesure trouvée dans ce fichier.'};
    return {docs:docs,nSes:nSes,nBody:nBody,skipped:skipped};
  }
  function applyImport(imp,mode){
    /* copie de sécurité pour pouvoir annuler */
    store.set(KEY_UNDO,JSON.stringify({ts:Date.now(),docs:S.docs}));
    var added=0,conflicts=0;
    if(mode==='replace'){S.docs=clone(imp.docs);added=imp.nSes+imp.nBody}
    else{
      Object.keys(imp.docs).forEach(function(id){
        var inc=imp.docs[id],cur=S.docs[id];
        if(!cur){S.docs[id]=clone(inc);added++;return}
        if(inc.kind==='session'){
          var any=false;
          Object.keys(inc.ex).forEach(function(xid){
            var ce=cur.ex[xid];
            if(!ce||!(ce.w>0||setsDone(ce)>0)){cur.ex[xid]=clone(inc.ex[xid]);any=true}
            else if(JSON.stringify(ce)!==JSON.stringify(inc.ex[xid]))conflicts++;
          });
          if(any)added++;
          if(!cur.t0&&inc.t0)cur.t0=inc.t0;if(!cur.t1&&inc.t1)cur.t1=inc.t1;
        }else if(inc.kind==='body'){
          if(!(cur.kg>0)&&inc.kg>0){cur.kg=inc.kg;added++}
          if(!(cur.waist>0)&&inc.waist>0){cur.waist=inc.waist;added++}
        }
      });
    }
    persist();
    return {added:added,conflicts:conflicts};
  }
  function undoImport(){
    var raw=store.get(KEY_UNDO);if(!raw)return false;
    try{var o=JSON.parse(raw);if(o&&o.docs){S.docs=o.docs;store.del(KEY_UNDO);persist();return true}}catch(e){}
    return false;
  }

      h+='<div class="bnr"><span>Données d\'une ancienne version trouvées sur cet appareil ('+plural(nl,'séance')+').</span><button type="button" data-act="legacy-import">Importer</button><button type="button" class="x" data-act="legacy-skip" aria-label="Ignorer">×</button></div>';
    }
    if(banners.install&&deferredInstall&&!isStandalone()&&!meta.installDismissed){
      h+='<div class="bnr"><span>Installe l\'appli sur ton écran d\'accueil.</span><button type="button" data-act="install">Installer</button><button type="button" class="x" data-act="install-skip" aria-label="Plus tard">×</button></div>';
    }
    bn.innerHTML=h;
  }
  bn.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-act]');if(!b)return;
    var a=b.getAttribute('data-act');
    if(a==='update')doUpdate();
    else if(a==='dismiss-corrupt'){banners.corrupt=false;renderBanners()}
    else if(a==='legacy-import'){
      var lg=legacyDocs();
      if(lg){var imp=parseImport(JSON.stringify(lg));if(!imp.err){var r=applyImport(imp,'merge');toast(importSummary(imp)+' repris.');}}
      meta.legacyDone=true;saveMeta();banners.legacy=false;renderBanners();updateStatus();rerender();
    }
    else if(a==='legacy-skip'){meta.legacyDone=true;saveMeta();banners.legacy=false;renderBanners()}
    else if(a==='install')doInstall();
    else if(a==='install-skip'){meta.installDismissed=true;saveMeta();renderBanners()}
  });
  function doInstall(){
    if(!deferredInstall)return;
    var p=deferredInstall;deferredInstall=null;
    p.prompt();
    if(p.userChoice)p.userChoice.then(function(){renderBanners();if(view==='plus')renderPlus()});
  }
  var reloadOnChange=false;
  function doUpdate(){
    if(swReg&&swReg.waiting){reloadOnChange=true;swReg.waiting.postMessage({type:'SKIP_WAITING'})}
    else location.reload();
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;banners.install=true;renderBanners();if(view==='plus'&&pl==='donnees')renderPlus()});
  window.addEventListener('appinstalled',function(){deferredInstall=null;banners.install=false;renderBanners();if(view==='plus')renderPlus()});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      swReg=reg;
      function watch(w){w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller){banners.update=true;renderBanners()}})}
      if(reg.waiting&&navigator.serviceWorker.controller){banners.update=true;renderBanners()}
      reg.addEventListener('updatefound',function(){if(reg.installing)watch(reg.installing)});
      document.addEventListener('visibilitychange',function(){if(!document.hidden){try{reg.update().catch(function(){})}catch(e){}}});
    }).catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloadOnChange)location.reload()});
  }
  if(navigator.storage&&navigator.storage.persisted){
    navigator.storage.persisted().then(function(p){
      if(p){persistState='yes';return}
      if(navigator.storage.persist)return navigator.storage.persist().then(function(g){persistState=g?'yes':'no'});
      persistState='no';
    }).then(function(){if(view==='plus'&&pl==='donnees')renderPlus()},function(){});
  }

  /* ================= Navigation + rendu global ================= */
  function applyViewProg(){applyProg()}
  function rerender(){
    var y=window.scrollY;
    applyViewProg();
    if(!dayOf(curDay))curDay=DAYS[0].key;
    buildTabs();markNav();markTabs();
    if(view==='seance')renderSeance();else if(view==='progres')renderProgress();else renderPlus();
    updateStatus();
    if(arguments[0]==='keep')window.scrollTo(0,y);
  }
  function go(v){view=v;rerender();window.scrollTo(0,0)}
  function pickDay(){
    var dow=parseD(curDate).getDay();
    var t=DAYS.filter(function(d){return d.dow===dow})[0];
    curDay=t?t.key:(store.get('ppl3:last')||'mer');
    if(!dayOf(curDay))curDay='mer';
  }
  document.getElementById('sync').addEventListener('click',function(){pl='donnees';go('plus')});
  tabsEl.addEventListener('click',function(ev){
    var b=ev.target.closest('.tab');
    if(b){curDay=b.getAttribute('data-k');store.set('ppl3:last',curDay);rerender();window.scrollTo(0,0)}
  });
  navEl.addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-v]');if(b)go(b.getAttribute('data-v'));
  });

  function refreshDelta(card){
    var id=card.getAttribute('data-ex'),ex=EXMAP[id],e=getEntry(id);
    var hist=history(id),pr=lastOf(before(hist,curDate));
    var di=deltaInfo(ex,e,pr);
    var p=card.querySelector('.delta');
    p.className='delta '+di.c;p.textContent=di.t;
    var pi=logged(ex,e)?prInfo(stats(curDate,e,!!ex.bw),hist):null,b=card.querySelector('.prb');
    if(b)b.hidden=!pi;
    var fin=document.getElementById('finish');
    if(fin){var cd=S.docs[sid(curDay,curDate)];fin.disabled=!(cd&&sessionDone(cd))}
  }
  function setNotesOpen(card,id,open){
    notesOpen[id]=open;
    card.querySelector('.nbody').hidden=!open;
    card.querySelector('.ntog').setAttribute('aria-expanded',open?'true':'false');
  }
  function redrawNotes(card){
    var id=card.getAttribute('data-ex'),old=card.querySelector('.notes');
    var tmp=document.createElement('div');
    tmp.innerHTML=notesHtml(id,getEntry(id));
    old.parentNode.replaceChild(tmp.firstChild,old);
  }
  function addNote(card){
    var id=card.getAttribute('data-ex'),inp=card.querySelector('.nin');
    var txt=inp.value.replace(/\s+/g,' ').trim().slice(0,140);
    if(!txt){inp.focus();return}
    notesOpen[id]=true;
    setEntry(id,{n:(getEntry(id).n||[]).concat([txt])});
    redrawNotes(card);
    var ni=card.querySelector('.nin');if(ni)ni.focus();
  }
  function fillLoads(){
    var d=dayOf(curDay),n=0;
    d.ex.forEach(function(ex){
      if(ex.bw||getEntry(ex.id).w>0)return;
      var pr=lastOf(before(history(ex.id),curDate)),t=targetOf(ex,pr);
      if(t){setEntry(ex.id,{w:t.w});n++}
    });
    renderSeance();
    toast(n+' charge'+(n>1?'s':'')+' pré-remplie'+(n>1?'s':'')+' selon l\'objectif du jour.');
  }

  main.addEventListener('click',function(ev){
    var t=ev.target;
    var act=t.closest('[data-act]');
    if(act){handleAct(act.getAttribute('data-act'));return}
    var ntog=t.closest('.ntog');
    if(ntog){var cn=ntog.closest('.ex'),idn=cn.getAttribute('data-ex');setNotesOpen(cn,idn,!notesOpen[idn]);return}
    var nplus=t.closest('.nplus');
    if(nplus){
      var cp=nplus.closest('.ex');setNotesOpen(cp,cp.getAttribute('data-ex'),true);
      var nin=cp.querySelector('.nin');if(nin)nin.focus();
      return;
    }
    var ndel=t.closest('.ndel');
    if(ndel){
      var cd=ndel.closest('.ex'),idd=cd.getAttribute('data-ex');
      var narr=(getEntry(idd).n||[]).slice();narr.splice(parseInt(ndel.getAttribute('data-ni'),10),1);
      setEntry(idd,{n:narr.length?narr:null});redrawNotes(cd);return;
    }
    var nok=t.closest('.nok');
    if(nok){addNote(nok.closest('.ex'));return}
    var adds=t.closest('.addset');
    if(adds){
      var ca=adds.closest('.ex'),ida=ca.getAttribute('data-ex'),ka=curDate+'|'+ida;
      extra[ka]=ca.querySelectorAll('.srow').length+1;
      var pa=lastOf(before(history(ida),curDate));
      ca.querySelector('.srows').innerHTML=rowsHtml(EXMAP[ida],getEntry(ida),pa,ka);
      return;
    }
    var sb=t.closest('.setbtn');
    if(sb){
      var card=sb.closest('.ex'),id=card.getAttribute('data-ex'),ex=EXMAP[id];
      var btns=card.querySelectorAll('.setbtn'),arr=[];
      var on=sb.getAttribute('aria-pressed')!=='true';
      sb.setAttribute('aria-pressed',on?'true':'false');
      Array.prototype.forEach.call(btns,function(x){arr.push(x.getAttribute('aria-pressed')==='true'?1:0)});
      setEntry(id,{s:arr});
      refreshDelta(card);
      if(on)startTimer(ex.sec,ex.n);
      return;
    }
    var pr=t.closest('.prior[data-w]');
    if(pr){
      var c=pr.closest('.ex'),eid=c.getAttribute('data-ex');
      var w=parseFloat(pr.getAttribute('data-w'));
      c.querySelector('.inw').value=num(w);
      setEntry(eid,{w:w});refreshDelta(c);
      return;
    }
    if(t.closest('#gobody')){pv='corps';go('progres');return}
    if(t.closest('#finish')){finishSession();return}
    if(t.closest('#fill')){fillLoads();return}
    if(t.closest('#reset')){
      DAYS.forEach(function(d){if(d.key===curDay)d.ex.forEach(function(ex){setEntry(ex.id,{s:null})})});
      renderSeance();return;
    }
    var pgb=t.closest('[data-pg]');
    if(pgb){
      var np=pgb.getAttribute('data-pg');
      if(PROGS[np]&&np!==getProg()){S.docs.prefs={kind:'prefs',prog:np};queueWrite();rerender()}
      return;
    }
    var sg=t.closest('.seg button');
    if(sg){
      if(sg.hasAttribute('data-pv'))pv=sg.getAttribute('data-pv');
      if(sg.hasAttribute('data-pm'))pm=sg.getAttribute('data-pm');
      if(sg.hasAttribute('data-pp'))pp=sg.getAttribute('data-pp');
      if(sg.hasAttribute('data-mw')){mw=parseInt(sg.getAttribute('data-mw'),10)||0;mwUser=true}
      if(sg.hasAttribute('data-pl')){pl=sg.getAttribute('data-pl');renderPlus();return}
      renderProgress();return;
    }
    var jr=t.closest('[data-recap]');
    if(jr){openRecap(jr.getAttribute('data-recap'));return}
    if(t.id==='bsave'){
      var date=document.getElementById('bdate').value||ymd(new Date());
      var kg=parseNum(document.getElementById('bkg').value),wa=parseNum(document.getElementById('bwaist').value);
      if(!kg&&!wa)return;
      var id2='b_'+date,old=S.docs[id2]||{kind:'body',date:date};
      if(kg)old.kg=kg;if(wa)old.waist=wa;
      S.docs[id2]=old;queueWrite();updateStatus();renderProgress();return;
    }
    var del=t.closest('[data-del]');
    if(del){removeDoc(del.getAttribute('data-del'));updateStatus();renderProgress();return}
  });
  function handleAct(a){
    if(a==='export')exportJson();
    else if(a==='csv')exportCsv();
    else if(a==='copy'){copyText(JSON.stringify(exportObj())).then(function(ok){
      if(ok){meta.lastBackup=Date.now();saveMeta();updateStatus();toast('Données copiées : colle-les dans une note ou un message.');if(view==='plus')renderPlus()}
      else toast('Copie impossible ici : utilise « Exporter mes données ».');
    })}
    else if(a==='install')doInstall();
    else if(a==='imp-paste'){var tx=document.getElementById('imptext').value.trim();if(!tx){setMsg('Colle d\'abord le contenu du fichier.','bad');return}offerImport(tx,'Texte collé')}
    else if(a==='imp-merge'||a==='imp-replace'){
      if(!pending)return;
      var mode=a==='imp-merge'?'merge':'replace';
      if(mode==='replace'&&!window.confirm('Remplacer tout ton historique actuel par le contenu du fichier ? Tu pourras annuler juste après.'))return;
      var r=applyImport(pending,mode),imp=pending;pending=null;
      meta.legacyDone=true;saveMeta();
      rerender();
      toast(mode==='merge'?(r.added+' élément'+(r.added>1?'s':'')+' ajouté'+(r.added>1?'s':'')+(r.conflicts?', '+r.conflicts+' doublon'+(r.conflicts>1?'s':'')+' conservé'+(r.conflicts>1?'s':'')+' tel quel':'')+'.'):('Historique remplacé : '+importSummary(imp)+'.'));
    }
    else if(a==='imp-undo'){if(undoImport()){rerender();toast('Import annulé.')}}
    else if(a==='wipe'){
      if(window.confirm('Effacer définitivement toutes tes séances et mesures sur ce téléphone ?')&&window.confirm('Dernière confirmation : as-tu exporté une sauvegarde ?')){
        store.set(KEY_UNDO,JSON.stringify({ts:Date.now(),docs:S.docs}));
        S={docs:{}};persist();rerender();toast('Données effacées. Tu peux encore annuler dans Données > Importer.');
      }
    }
  }
  main.addEventListener('input',function(ev){
    var inp=ev.target;
    if(!inp.classList)return;
    var card=inp.closest('.ex');
    if(!card)return;
    var id=card.getAttribute('data-ex');
    if(inp.classList.contains('inw')){
      setEntry(id,{w:parseNum(inp.value)});
      refreshDelta(card);
    }else if(inp.classList.contains('sr')){
      var rows=card.querySelectorAll('.srow'),arr=[],any=false,idx=-1;
      Array.prototype.forEach.call(rows,function(row,i){
        var v=parseInt(row.querySelector('.sr').value,10);
        v=v>0?Math.min(v,999):0;
        arr.push(v);if(v>0)any=true;
        if(row.contains(inp))idx=i;
      });
      var patch={reps:arr};
      if(any)patch.r=null;           /* l'ancienne saisie "reps les plus faibles" est remplacée */
      setEntry(id,patch);
      var rw=rows[idx],sd=setDelta(arr[idx],parseInt(rw.getAttribute('data-prev'),10)||0,rw.getAttribute('data-lg')==='1');
      var sp=rw.querySelector('.sdel');sp.className='sdel '+sd.c;sp.textContent=sd.t;
      refreshDelta(card);
    }
  });
  main.addEventListener('keydown',function(ev){
    var t=ev.target;
    if(ev.key!=='Enter'||!t.classList)return;
    if(t.classList.contains('nin')){ev.preventDefault();addNote(t.closest('.ex'));return}
    if(t.classList.contains('sr')){
      ev.preventDefault();
      var all=t.closest('.ex').querySelectorAll('.sr'),i=Array.prototype.indexOf.call(all,t);
      if(all[i+1])all[i+1].focus();else t.blur();
    }
  });
  main.addEventListener('change',function(ev){
    var t=ev.target;
    if(t.id==='sdate'&&t.value){curDate=t.value;dateAuto=(t.value===ymd(new Date()));markDone();renderSeance()}
    else if(t.id==='pex'){pex=t.value;renderProgress()}
    else if(t.id==='wake')setWake(t.checked);
    else if(t.id==='theme'){meta.theme=t.value;saveMeta();applyTheme()}
    else if(t.id==='impfile'){
      var f=t.files&&t.files[0];if(!f)return;
      var rd=new FileReader();
      rd.onload=function(){offerImport(String(rd.result),'Fichier « '+f.name+' »')};
      rd.onerror=function(){setMsg('Lecture du fichier impossible.','bad')};
      rd.readAsText(f);
      t.value='';
    }
  });

  /* ================= Démarrage ================= */
  applyTheme();
  var hash=(location.hash||'').replace('#','');
  if(hash==='progres'||hash==='plus')view=hash;
  pickDay();
  setSyncInit();
  function setSyncInit(){
    if(corrupt)banners.corrupt=true;
    if(!meta.legacyDone&&legacyDocs())banners.legacy=true;
    renderBanners();
  }
  rerender();
  if(meta.wake)reqWake();
  /* petit accès pour les tests automatiques */
  window.__ppl={exmap:EXMAP,progs:PROGS,S:function(){return S},meta:function(){return meta},parseImport:parseImport,applyImport:applyImport,recapData:recapData,history:history,prInfo:prInfo,persist:persist,go:go};
})();

</script>
</body>
</html>
